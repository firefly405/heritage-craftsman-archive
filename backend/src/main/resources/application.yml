server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: heritage-archive-system
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/heritage_archive?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:codex_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
logging:
  level:
    com.qizixuan.heritage: info
app:
  seed-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
alipay:
  sandbox:
    enabled: ${ALIPAY_SANDBOX_ENABLED:false}
    gateway: ${ALIPAY_SANDBOX_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do?charset=utf-8}
    app-id: ${ALIPAY_SANDBOX_APP_ID:}
    private-key: ${ALIPAY_SANDBOX_PRIVATE_KEY:}
    private-key-file: ${ALIPAY_SANDBOX_PRIVATE_KEY_FILE:}
    return-url: ${ALIPAY_SANDBOX_RETURN_URL:}
